<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <!-- String -->
  <line x1="40" y1="0" x2="40" y2="12" stroke="#8B4513" stroke-width="2"/>
  <!-- Top cap -->
  <rect x="20" y="10" width="40" height="8" rx="4" fill="#CC0000"/>
  <!-- Body -->
  <ellipse cx="40" cy="60" rx="28" ry="42" fill="#FF3333"/>
  <!-- Vertical ribs -->
  <line x1="40" y1="18" x2="40" y2="102" stroke="#CC0000" stroke-width="1.5" opacity="0.4"/>
  <path d="M33,19 Q20,60 33,101" stroke="#CC0000" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M47,19 Q60,60 47,101" stroke="#CC0000" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Glow inside -->
  <ellipse cx="40" cy="55" rx="18" ry="28" fill="#FFD700" opacity="0.35"/>
  <!-- Bottom cap -->
  <rect x="20" y="102" width="40" height="8" rx="4" fill="#CC0000"/>
  <!-- Tassel -->
  <line x1="36" y1="110" x2="33" y2="124" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="40" y1="110" x2="40" y2="126" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="44" y1="110" x2="47" y2="124" stroke="#FFD700" stroke-width="1.5"/>
  <!-- Kanji 祭 -->
  <text x="40" y="67" text-anchor="middle" font-size="22" font-family="serif" fill="#FFD700" font-weight="bold">祭</text>
</svg>
